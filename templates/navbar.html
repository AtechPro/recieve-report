<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Valve Report Generator{% endblock %}</title>
    <style>
        :root {
            --deep-teal: #167E66;
            --muted-green: #8CB8AC;
            --pure-white: #FFFFFF;
            --dark-teal: #20735F;
            --medium-teal: #2CA184;
            --very-dark-teal: #235647;
            --almost-white: #FEFEFE;
            --light-mint: #FAFCFB;
            --light-gray: #F5F5F5;
            --light-gray-2: #f0f0f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--light-mint) 0%, var(--almost-white) 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--very-dark-teal);
            line-height: 1.6;
        }

        /* Top Navigation Bar */
        .top-navbar {
            background: linear-gradient(135deg, var(--deep-teal) 0%, var(--dark-teal) 100%);
            box-shadow: 0 4px 20px rgba(22, 126, 102, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--pure-white);
            text-decoration: none;
        }

        .nav-brand h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .nav-brand p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 5px;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: var(--pure-white);
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .nav-link.active {
            background: var(--medium-teal);
            box-shadow: 0 2px 10px rgba(44, 161, 132, 0.3);
        }

        .nav-link i {
            font-size: 1.1rem;
        }

        /* Mobile menu button */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--pure-white);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .mobile-menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Main content area */
        .main-content {
            padding-top: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .nav-content {
                flex-direction: column;
                gap: 15px;
                padding: 10px 0;
            }

            .nav-brand h1 {
                font-size: 1.5rem;
            }

            .nav-brand p {
                font-size: 0.8rem;
            }

            .mobile-menu-btn {
                display: block;
                position: absolute;
                top: 15px;
                right: 20px;
            }

            .nav-menu {
                flex-direction: column;
                width: 100%;
                gap: 2px;
                display: none;
            }

            .nav-menu.show {
                display: flex;
            }

            .nav-link {
                padding: 15px 20px;
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.05);
            }

            .nav-link:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }

        @media (max-width: 480px) {
            .nav-container {
                padding: 0 15px;
            }

            .nav-brand h1 {
                font-size: 1.3rem;
            }

            .nav-link {
                padding: 12px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="nav-container">
            <div class="nav-content">
                <a href="/" class="nav-brand">
                    <h1>🔧 Valve Report Generator</h1>
                    <p>Professional PDF Report System</p>
                </a>
                
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    ☰
                </button>
                
                <ul class="nav-menu" id="navMenu">
                    <li class="nav-item">
                        <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                            📋 Receive Report
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/finding-report" class="nav-link {% if request.endpoint == 'finding_report' %}active{% endif %}">
                            🔍 Finding Report
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/excel-upload" class="nav-link {% if request.endpoint == 'excel_upload' %}active{% endif %}">
                            📊 Excel Upload
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        function toggleMobileMenu() {
            const navMenu = document.getElementById('navMenu');
            navMenu.classList.toggle('show');
        }

        // Close mobile menu when clicking outside
        document.addEventListener('click', function(event) {
            const navMenu = document.getElementById('navMenu');
            const mobileBtn = document.querySelector('.mobile-menu-btn');
            
            if (!navMenu.contains(event.target) && !mobileBtn.contains(event.target)) {
                navMenu.classList.remove('show');
            }
        });

        // Close mobile menu when window is resized to desktop
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                document.getElementById('navMenu').classList.remove('show');
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
